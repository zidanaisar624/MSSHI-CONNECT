name: Build and test MSSHI Connect on Windows

on:
  push:
    branches: [main]
    tags: ['v1.0.0']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-x64:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test the JavaScript interface
        run: node --test tests/connect.test.mjs
      - name: Test the Rust engine and embedded interface
        run: cargo test --workspace --locked
      - name: Build release executable
        run: cargo build --locked --release --bin msshi-connect
      - name: Test and package portable files
        shell: pwsh
        run: ./tools/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: MSSHI-Connect-Windows-x64
          path: |
            dist/MSSHI-Connect-Portable-win-x64.exe
            dist/MSSHI-Connect-1.0.0-windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    if: github.ref == 'refs/tags/v1.0.0'
    needs: windows-x64
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MSSHI-Connect-Windows-x64
          path: dist
      - name: Verify and publish the three release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          $names = @("MSSHI-Connect-Portable-win-x64.exe","MSSHI-Connect-1.0.0-windows-x64.zip")
          $manifest = @(Get-Content -LiteralPath dist/SHA256SUMS.txt)
          if ($manifest.Count -ne $names.Count) { throw "Unexpected release manifest" }
          foreach ($name in $names) {
            $hash = (Get-FileHash -LiteralPath "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($manifest -cnotcontains "$hash  $name") { throw "Checksum mismatch for $name" }
          }
          gh release create "$env:TAG" dist/MSSHI-Connect-Portable-win-x64.exe dist/MSSHI-Connect-1.0.0-windows-x64.zip dist/SHA256SUMS.txt --repo "$env:REPOSITORY" --verify-tag --title "MSSHI Connect $env:TAG" --notes "Buka EXE atau ekstrak ZIP di Windows x64. Panduan awal tersedia dalam README."
