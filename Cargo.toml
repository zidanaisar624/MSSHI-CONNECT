[workspace]
resolver = "2"
members = [
    "crates/msshi-connect-core",
    "crates/msshi-connect-app",
]

[workspace.package]
version = "1.0.2"
edition = "2021"
license = "MIT"
authors = ["Muhammad Zidan Aisar (MuZA)"]
repository = "https://github.com/zidanaisar624/MSSHI-CONNECT"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
